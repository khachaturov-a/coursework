version: "3.8"

services:
  Coursework:
    image: ${IMAGE_NAME}
    container_name: Coursework-app
    ports:
      - "${APP_PORT}:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=${ASPNETCORE_ENVIRONMENT}
      - ASPNETCORE_URLS=http://+:8080
      # Переопределяем путь к БД — файл хранится в именованном volume
      - ConnectionStrings__DefaultConnection=Data Source=/app/data/chetki.db
    volumes:
      - ./appsettings.json:/app/appsettings.json:ro
      - bead-data:/app/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    restart: unless-stopped

volumes:
  bead-data:


